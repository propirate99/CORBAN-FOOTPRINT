services:
  postgres:
    image: postgres:16-alpine
    container_name: cct-postgres
    environment:
      POSTGRES_DB: campustwin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campustwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cct-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/campustwin
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cct-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

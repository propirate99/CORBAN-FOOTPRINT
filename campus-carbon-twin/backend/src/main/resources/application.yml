spring:
  application:
    name: campus-carbon-twin-backend
  profiles:
    active: local

genai:
  enabled: ${GENAI_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  timeout-seconds: 8

supabase:
  url: ${SUPABASE_URL:https://xyzcompany.supabase.co}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER:${supabase.url}/auth/v1}
    jwk-set-uri: ${SUPABASE_JWK_SET_URI:${supabase.url}/auth/v1/.well-known/jwks.json}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
